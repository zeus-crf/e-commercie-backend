server:
  port: 8080

spring:
  application:
    name: ecommercie
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommercie
    username: postgres
    password: 2007
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB       # tamanho maximo por arquivo enviado
      max-request-size: 10MB    # tamanho maximo da requisicao inteira

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
security:
  jwt:
    # DEV: default descartavel (nao e o segredo real). Producao sobrescreve via JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-use-JWT_SECRET-do-env-0123456789}
    access-expiration: 900000
    refresh-expiration: 604800000
  cookie:
    secure: false

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}

  mail:
    from: ${MAIL_FROM:no-reply@ecommercie.local}

management:
  endpoints:
    web:
      exposure:
        include: health
storage:
  local:
    dir: uploads                          # pasta onde salva (relativa ao projeto)
  public-url: http://localhost:8080/files # base da URL devolvida

mercado-pago-access_token: ${MP_ACCESS_TOKEN:APP_USR-4577563560618227-081318-eccc5179f422366b7f0b76478c824195-3615189676}
mercado-pago-notification_url: ${MP_NOTIFICATION_URL:http://localhost:8080/webhooks/mercadopago}