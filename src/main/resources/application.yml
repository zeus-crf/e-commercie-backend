server:
  port: 8080

spring:
  application:
    name: ecommercie
  # Carrega o .env (formato CHAVE=valor) como properties para rodar local sem exportar variaveis.
  # "optional:" = no Docker/CI, onde as variaveis vem do ambiente, a ausencia do arquivo nao quebra.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommercie
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB       # tamanho maximo por arquivo enviado
      max-request-size: 10MB    # tamanho maximo da requisicao inteira

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
security:
  jwt:
    # SEM default: se JWT_SECRET faltar, a aplicacao NAO sobe (proposital)
    secret: ${JWT_SECRET}
    access-expiration: 900000
    refresh-expiration: 604800000
  cookie:
    secure: false

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}

  mail:
    from: ${MAIL_FROM:no-reply@ecommercie.local}

management:
  endpoints:
    web:
      exposure:
        include: health
storage:
  local:
    dir: uploads                          # pasta onde salva (relativa ao projeto)
  public-url: http://localhost:8080/files # base da URL devolvida

# SEM default: a credencial vem do ambiente, nunca do repositorio
mercado-pago-access_token: ${MP_ACCESS_TOKEN}
mercado-pago-notification_url: ${MP_NOTIFICATION_URL}

melhorenvio:
  token: ${ME_TOKEN}
  origin-cep: ${SHIPPING_ORIGIN_CEP}
  user-agent: ${ME_USER_AGENT:ecommercie/1.0 contato@ecommercie.local}
  base-url: ${ME_BASE_URL:https://sandbox.melhorenvio.com.br}

features:
  fiscal:
    enabled: ${FISCAL_ENABLED:false}
    tipo: ${FISCAL_TIPO:DCE}

focusnfe:
  token: ${FOCUSNFE_TOKEN:}
  base-url: ${FOCUSNFE_BASE_URL:https://homologacao.focusnfe.com.br}
  # Dados do emissor — do cliente, nao do codigo. Confirmar com o contador antes de ligar o toggle.
  emitente:
    cnpj: ${FOCUSNFE_CNPJ:}
    inscricao-estadual: ${FOCUSNFE_IE:}
    uf: ${FOCUSNFE_UF:}
    regime-tributario: ${FOCUSNFE_REGIME:1}          # 1 = Simples Nacional, 3 = Regime Normal
    icms-cst: ${FOCUSNFE_ICMS_CST:102}               # CSOSN (Simples) ou CST (Normal)
    pis-cst: ${FOCUSNFE_PIS_CST:07}
    cofins-cst: ${FOCUSNFE_COFINS_CST:07}
    tipo-emitente: ${FOCUSNFE_TIPO_EMITENTE:2}       # DC-e: "1" a "4"
    modalidade-transporte: ${FOCUSNFE_MODALIDADE_TRANSPORTE:0}  # DC-e: "0", "1" ou "2"

