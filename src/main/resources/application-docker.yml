spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

security:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 900000
    refresh-expiration: 604800000
  cookie:
    secure: true

logging:
  level:
    com.ecommercie: WARN
    org.flywaydb: DEBUG