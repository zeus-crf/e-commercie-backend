# Perfil de teste. NENHUM valor real aqui — os providers externos sao stubados ou mockados.
# O datasource vem do Testcontainers via @ServiceConnection; a senha abaixo so existe para
# satisfazer o placeholder do application.yml, que nao tem default de proposito.
spring:
  datasource:
    password: test
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

security:
  jwt:
    # segredo fixo so-para-teste (min. 256 bits para HS256)
    secret: teste-apenas-nao-e-segredo-real-0123456789-abcdefghij-0123456789
    access-expiration: 900000
    refresh-expiration: 604800000
  cookie:
    secure: false

app:
  cors:
    allowed-origin: http://localhost:4200

# credenciais FALSAS: nenhum teste chama o Mercado Pago de verdade
mercado-pago-access_token: TEST-token-falso-de-teste
mercado-pago-notification_url: http://localhost:8080/api/v1/webhooks/mercadopago

# O relay agendado fica desligado nos testes: quem dispara processOutbox() é o próprio teste.
# Sem isso o job de fundo disputa os eventos e o resultado vira aleatório.
outbox:
  relay:
    initial-delay: 86400000

melhorenvio:
  token: Bearer fake-token-test
  origin-cep: "01310100"
  user-agent: "ecommercie/1.0 test"
  base-url: https://sandbox.melhorenvio.com.br
