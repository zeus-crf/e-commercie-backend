spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

# O relay agendado fica desligado nos testes: quem dispara processOutbox() é o próprio teste.
# Sem isso o job de fundo disputa os eventos e o resultado vira aleatório.
outbox:
  relay:
    initial-delay: 86400000

melhorenvio:
  token: Bearer fake-token-test
  origin-cep: "01310100"
  user-agent: "ecommercie/1.0 test"
  base-url: https://sandbox.melhorenvio.com.br
